refresh_recordings:
  name: Refresh recordings
  description: Refresh the cached Tuya SD-card recording index.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to refresh all Tuya Recordings entries.
      required: false
      selector:
        text:

clear_cache:
  name: Clear cache
  description: Clear the cached Tuya SD-card recording index.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to clear all Tuya Recordings entries.
      required: false
      selector:
        text:

clear_video_cache:
  name: Clear video cache
  description: Delete local video copies and remember their deletion so Sync does not download them again. Keeps the recording index, thumbnails and camera SD recordings.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to clear cached videos for all Tuya Recordings entries.
      required: false
      selector:
        text:

sync_media:
  name: Sync media
  description: Download all discovered Tuya SD-card recordings when Media Sync is enabled.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to sync all Tuya Recordings entries with Media Sync enabled.
      required: false
      selector:
        text:

populate_thumbnails:
  name: Populate thumbnails
  description: Populate missing recording thumbnails from already cached recordings.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to populate thumbnails for all Tuya Recordings entries.
      required: false
      selector:
        text:
    limit:
      name: Limit
      description: Maximum number of missing thumbnails to attempt.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box

delete_local_recording:
  name: Delete local recording
  description: Delete a local MP4 and thumbnail, and prevent Sync from downloading it again. The camera SD recording is not deleted.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    dev_id:
      name: Camera device ID
      required: true
      selector:
        text:
    start:
      name: Recording start timestamp
      required: true
      selector:
        number:
          min: 1
          mode: box
    end:
      name: Recording end timestamp
      required: true
      selector:
        number:
          min: 1
          mode: box

allow_local_recording_downloads:
  name: Allow download again
  description: Forget local deletion markers for one recording, one camera, or all cameras in the selected account. The next normal Sync pass may download eligible recordings again.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    dev_id:
      name: Camera device ID
      required: false
      selector:
        text:
    start:
      name: Recording start timestamp
      description: For one recording, supply camera ID and both timestamps.
      required: false
      selector:
        number:
          min: 1
          mode: box
    end:
      name: Recording end timestamp
      required: false
      selector:
        number:
          min: 1
          mode: box
