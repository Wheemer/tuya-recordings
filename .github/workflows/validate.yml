name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Python test dependencies
        timeout-minutes: 3
        run: python -m pip install --timeout 20 -r requirements-test.txt
      - name: Install Chromium system dependencies
        timeout-minutes: 6
        run: python -m playwright install-deps chromium
      - name: Install system FFmpeg
        timeout-minutes: 2
        run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --yes --no-install-recommends ffmpeg
      - name: Download Chromium
        timeout-minutes: 2
        run: python -m playwright install chromium
      - name: Validate pinned frontend bundles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python tools/vendor_frontend.py
      - name: Validate Python, JSON, and tests
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q custom_components tests
          python - <<'PY'
          import json
          from pathlib import Path

          component = Path("custom_components/tuya_recordings")
          for path in [component / "manifest.json", component / "strings.json", *sorted((component / "translations").glob("*.json"))]:
              json.loads(path.read_text(encoding="utf-8"))
          PY
          python -m ruff check custom_components tests
          python -m pytest -q
      - name: Validate HACS release archive layout
        run: |
          python tools/build_release_zip.py --output "$RUNNER_TEMP/tuya_recordings.zip"
      - name: Validate browser playback and layout
        env:
          PYTHONPATH: .
        run: |
          python tests/native_player.browser.py
          python tests/timeline_panel.browser.py
          python tests/panel_style.browser.py
          node --check custom_components/tuya_recordings/frontend/camera-player.js
          node --check custom_components/tuya_recordings/frontend/panel.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
